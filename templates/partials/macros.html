{% macro page_hero(title, subtitle="", breadcrumb_label="", tag="") %}
<div class="page-hero">
  <div class="page-hero-inner">
    {% if breadcrumb_label %}
    <div class="breadcrumb">
      <a href="{{ depth }}index.html">Home</a>
      <span class="breadcrumb-sep">›</span>
      {% if breadcrumb_label %}{{ breadcrumb_label }}{% endif %}
    </div>
    {% endif %}
    {% if tag %}<div class="hero-eyebrow" style="margin-top:0.75rem;display:inline-flex">{{ tag }}</div>{% endif %}
    <h1>{{ title }}</h1>
    {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
  </div>
</div>
{% endmacro %}
