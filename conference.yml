cfp:
  submission_deadline: "April 29, 2026"
  proposal_deadline: "April 29, 2026"
  cfp_pdf_url: "/../static/docs/CFP-IEEECOINS26.pdf"
  ieee_template_url: "https://www.ieee.org/conferences/publishing/templates.html"
  max_pages: 6
  extra_page_fee: 150
  max_extra_pages: 2
  review_type: "Double-blind"
  program_chairs:
    - name: "Florenc Demrozi"
      affiliation: "University of Stavanger, Norway"
      email: "coins@coinsconf.com"
    - name: "Federica Zonzini"
      affiliation: "University of Bologna, Italy"
      email: "coins@coinsconf.com"
  clusters:
    - id: "c1"
      number: "Cluster 1"
      title: "Enabling Intelligence"
      subtitle: "Hardware — Design — Architecture"
      tracks:
        - number: "Track 1"
          title: "AI Hardware, Circuits, and Devices"
          description: "Physical and circuit-level foundations of intelligent computing."
          topics:
            - "Compute-in-memory (CIM/PIM) and near-sensor computing"
            - "Analog and mixed-signal AI accelerators"
            - "On-chip and in-memory learning"
            - "Low-power and energy-efficient AI hardware"
            - "Heterogeneous integration (2.5D/3D, chiplets)"
            - "Emerging devices and materials (photonic, quantum, neuromorphic)"
            - "Reliability, variation tolerance, and aging-aware design"
          keywords: ["CIM/PIM", "Analog MACs", "On-chip learning", "Chiplets", "Photonic AI"]
        - number: "Track 2"
          title: "AI-Driven Design Automation and Optimization"
          description: "ML-enabled EDA and cross-layer optimization."
          topics:
            - "Machine learning for EDA flows"
            - "AI-assisted placement, routing, and timing closure"
            - "Reinforcement learning for design-space exploration"
            - "Generative design and circuit synthesis"
            - "Formal verification, testing, and ATPG"
            - "HW/SW co-design and PPA optimization"
            - "Telemetry-driven and runtime optimization"
          keywords: ["ML for EDA", "Timing closure", "Formal verification", "HW/SW co-synthesis"]
        - number: "Track 3"
          title: "AI Architectures and Systems Design"
          description: "Next-generation AI accelerators and system architectures."
          topics:
            - "AI accelerator architectures and dataflow design"
            - "Memory-centric and bandwidth-aware architectures"
            - "Sparsity, quantization, and compression support"
            - "Chiplet-based and RISC-V AI systems"
            - "Interconnects, NoCs, and coherence protocols"
            - "Compiler and runtime co-design"
            - "Scalable training and inference systems"
          keywords: ["AI accelerators", "RISC-V", "NoC/Interconnect", "HBM/HMC", "Dataflow"]
    - id: "c2"
      number: "Cluster 2"
      title: "Connected Intelligence"
      subtitle: "Network — Cloud — IoT"
      tracks:
        - number: "Track 4"
          title: "AI-Native Connectivity, Networks, and Distributed Intelligence"
          description: "AI-native communication and network intelligence across 6G/7G systems."
          topics:
            - "AI-native and semantic communications (6G/7G)"
            - "Federated and in-network learning"
            - "O-RAN RIC (xApps/rApps)"
            - "Integrated sensing, communication, and computation"
            - "Reconfigurable intelligent surfaces (RIS)"
            - "Network digital twins and self-organizing networks"
          keywords: ["6G/7G", "O-RAN RIC", "Federated learning", "RIS/ISAC", "Semantic comms"]
        - number: "Track 5"
          title: "Cloud, Infrastructure, and Data-Centric Intelligence"
          description: "AI computing infrastructure and data engineering."
          topics:
            - "Cloud-edge orchestration and virtualization"
            - "Data pipelines, feature stores, and vector databases"
            - "MLOps and LLMOps"
            - "LLM serving and inference optimization"
            - "Autoscaling, SLA-aware resource management"
            - "Sustainable and energy-efficient cloud infrastructures"
            - "Blockchain and data provenance"
          keywords: ["MLOps/LLMOps", "Vector DBs", "Model serving", "Digital twins", "Autoscaling"]
        - number: "Track 6"
          title: "Internet of Things (IoT) and Cyber-Physical Intelligence"
          description: "IoT, edge intelligence, and cyber-physical systems."
          topics:
            - "Intelligent sensing and actuation"
            - "Embedded AI and TinyML"
            - "Cyber-physical systems and real-time analytics"
            - "Time-sensitive networking (TSN)"
            - "Hardware-in-the-loop simulation"
            - "Industrial IoT and smart infrastructure"
            - "Digital twins and adaptive IoT systems"
          keywords: ["TinyML", "TSN", "CPS", "Edge-cloud", "Digital twins", "Adaptive IoT"]
    - id: "c3"
      number: "Cluster 3"
      title: "Trusted and Autonomous Intelligence"
      subtitle: "Security — Agency — Cognition"
      tracks:
        - number: "Track 7"
          title: "Secure, Reliable, and Trustworthy AI Systems"
          description: "Hardware and AI security for trustworthy intelligent systems."
          topics:
            - "Hardware and AI security"
            - "Side-channel and fault-injection attacks"
            - "Privacy-preserving and federated learning"
            - "Model watermarking and supply-chain security"
            - "Runtime attestation and monitoring"
            - "Certified robustness and verification"
            - "AI governance and lifecycle assurance"
          keywords: ["AI security", "Adversarial robustness", "Privacy (FL/DP/HE)", "Attestation"]
        - number: "Track 8"
          title: "Agentic and Robotic AI Systems"
          description: "Autonomous and agentic AI in software and embodied forms."
          topics:
            - "Autonomous and agentic AI systems"
            - "Robotics perception, SLAM, and manipulation"
            - "Task and motion planning (TAMP)"
            - "Reinforcement learning for control"
            - "Multi-robot systems and coordination"
            - "LLM-enabled robotic agents and embodied AI"
            - "Sim-to-real transfer and field validation"
          keywords: ["Robotics", "SLAM", "TAMP", "Multi-robot", "Sim-to-real", "Embodied AI"]
        - number: "Track 9"
          title: "Foundational, Generative, and Cognitive AI"
          description: "Core algorithmic and model innovations in AI."
          topics:
            - "Foundation and multimodal models (LLMs, VLMs)"
            - "Generative AI and generative design"
            - "Retrieval-augmented generation (RAG)"
            - "Parameter-efficient fine-tuning (LoRA/QLoRA)"
            - "Reinforcement learning and alignment"
            - "Neurosymbolic and cognitive architectures"
            - "Continual and efficient learning"
          keywords: ["LLMs/VLMs", "RAG", "LoRA/QLoRA", "RLHF", "Continual learning", "Alignment"]
    - id: "c4"
      number: "Cluster 4"
      title: "Human-Aligned and Applied Intelligence"
      subtitle: "Human — Ethics — Industry"
      tracks:
        - number: "Track 10"
          title: "Human-Centered AI, Interaction, and Visualization"
          description: "Human-AI interfaces and decision support systems."
          topics:
            - "Explainable and interpretable AI interfaces"
            - "Human-AI interaction and decision support"
            - "Visualization of uncertainty and provenance"
            - "XR/AR/VR for operations and training"
            - "Conversational interfaces and multimodal interaction"
            - "Human-in-the-loop systems and evaluation"
            - "Trust, usability, and safety UX"
          keywords: ["XAI", "XR/AR/VR", "Human-in-the-loop", "Trust & safety UX", "Provenance"]
        - number: "Track 11"
          title: "Responsible, Ethical, and Sustainable AI"
          description: "Fairness, accountability, and sustainability in AI lifecycles."
          topics:
            - "Fairness, accountability, and transparency"
            - "AI risk management and impact assessment"
            - "Auditing, reporting, and model documentation"
            - "AI governance and policy frameworks"
            - "Safety certification and compliance"
            - "Environmental impact of AI systems"
            - "Sustainable AI practices"
          keywords: ["Fairness", "Transparency", "Governance", "Sustainability", "Risk management"]
        - number: "Track 12"
          title: "Vertical Applications in Smart Cities, Industry 4.0, Healthcare & Beyond"
          description: "AI-driven applications demonstrating real-world impact."
          topics:
            - "AI applications in healthcare and digital medicine"
            - "Industry 4.0 and predictive manufacturing"
            - "Process control and industrial automation"
            - "Smart energy, mobility, and logistics"
            - "Urban digital twins and smart cities"
            - "Resilient and sustainable infrastructures"
            - "Cross-domain AI integration"
          keywords: ["AIoT", "Digital medicine", "Industry 4.0", "Smart cities", "Smart agriculture"]
  special_sessions:
    - title: "Emerging Technology Enablers for IoT-AI Ecosystems"
      chair: "Mian Ahmad Jan, University of Sharjah"
      description: >
        Focuses on emerging enabling technologies driving the convergence of IoT and AI,
        with emphasis on embodied, physical, and agentic intelligence in real-world systems.
        Covers edge and embedded AI, distributed multi-agent systems, large-scale AI models,
        and next-generation communication technologies.
      keywords: ["Embodied AI", "Physical AI", "Agentic AI", "Edge AI", "LLMs", "5G/6G"]
    - title: "Emerging Blockchain Technologies for IoT and AI Systems"
      chair: "TBA"
      description: >
        Blockchain and distributed ledger technologies for secure, decentralized IoT and AI
        systems. Covers data integrity, trust management, smart contracts, edge computing
        integration, and privacy-preserving mechanisms.
      keywords: ["Blockchain", "DLT", "Smart contracts", "Decentralized systems", "Trust management"]
    - title: "Emerging Edge AI and Generative AI: On-Device LLMs"
      chair: "TBA"
      description: >
        Convergence of Edge AI and Generative AI, emphasizing on-device LLMs. Covers TinyML,
        model compression, quantization, MoE, distributed edge-cloud collaboration, and
        hardware-software co-design.
      keywords: ["On-device LLMs", "TinyML", "Quantization", "MoE", "Efficient inference"]

