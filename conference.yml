tutorials:
  - id: "t1"
    title: "From TinyML to EdgeAI — Tutorial and Practical Examples"
    presenter: "Danilo Pau"
    affiliation: "STMicroelectronics, Italy"
    duration: "Half-day"
    abstract: >
      This tutorial covers the full spectrum from TinyML to Edge AI, with hands-on practical
      examples on real hardware and software frameworks. Participants will learn model
      optimization techniques, deployment workflows on microcontrollers and edge devices,
      and gain first-hand experience with industry-grade tools and pipelines.
    confirmed: true

  - id: "t2"
    title: "RISC-V Architectures and Ecosystem"
    presenter: "University of Bologna — ETH Zurich Team"
    affiliation: "University of Bologna / ETH Zurich"
    duration: "Half-day"
    abstract: >
      This tutorial introduces the RISC-V open instruction set architecture and its growing
      ecosystem of processors, extensions, and tools. Topics include the RISC-V ISA, custom
      extensions for AI acceleration, open-source toolchains, and the PULP platform developed
      at the University of Bologna and ETH Zurich.
    confirmed: true

